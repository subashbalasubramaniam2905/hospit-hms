spring:
  application.name: hospitos-server
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/hospit}
    username: ${DATABASE_USER:hospit}
    password: ${DATABASE_PASSWORD:hospit}
  flyway:
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration}
  jackson:
    default-property-inclusion: non_null
server:
  port: ${PORT:8080}
  error.include-message: never
  # Trust X-Forwarded-For only from private-network proxies (Tomcat's default internal-proxies list).
  forward-headers-strategy: native
management:
  endpoints.web.exposure.include: health
hospitos:
  # Must be at least 32 characters. Set JWT_SECRET in every real environment.
  jwt-secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
  # Encrypts integration secrets (API keys, tokens) at rest. Set SECRET_KEY (32+ characters) in every real environment.
  secret-key: ${SECRET_KEY:}
  token-hours: ${TOKEN_HOURS:8}
  cors-origins: ${CORS_ORIGINS:http://localhost:4200,http://localhost:4201}
  # Creates the first super administrator when no accounts exist yet.
  bootstrap-admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    name: ${ADMIN_NAME:Super Admin}
  # Clinic time zone for appointments and the queue.
  timezone: ${HOSPITOS_TIMEZONE:Asia/Kolkata}
