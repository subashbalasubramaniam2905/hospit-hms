name: Server build and tests

on:
  pull_request:
    paths: ['server/**', '.github/workflows/server.yml']
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/server.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hospit
          POSTGRES_PASSWORD: hospit
          POSTGRES_DB: hospit_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U hospit" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B verify
