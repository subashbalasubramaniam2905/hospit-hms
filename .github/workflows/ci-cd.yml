# CI/CD for HospitOS.
#  - Every pull request and every push: build and test the server and the web app.
#  - Every push to main, once both pass: redeploy the API on Render, wait until Render runs this exact commit,
#    then publish the web app on GitHub Pages. The live demo therefore always matches main.
# Setup (Render deploy hook secret, API URL variable): docs/DEPLOY.md
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: Server build and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hospit
          POSTGRES_PASSWORD: hospit
          POSTGRES_DB: hospit_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U hospit" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B verify
      # The same image Render builds, so a broken Dockerfile fails here instead of on Render.
      - name: Docker image builds
        run: docker build -q -t hospitos-api .

  web:
    name: Web app build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:demo
      # With the HOSPITOS_API_URL repository variable set, the published site signs in against the Render API.
      # Without it the site stays the browser-only prototype with fictional data.
      - name: Point the site at the demo API
        if: github.ref == 'refs/heads/main' && vars.HOSPITOS_API_URL != ''
        env:
          API_URL: ${{ vars.HOSPITOS_API_URL }}
        run: |
          node -e '
            const url = process.env.API_URL.trim().replace(/\/+$/, "");
            if (!/^https:\/\/[^\s"<>]+$/.test(url)) { console.error("HOSPITOS_API_URL must be an https:// address"); process.exit(1); }
            require("fs").writeFileSync("dist/hospit-hms/browser/config.js",
              "/* Written by the CI/CD workflow from the HOSPITOS_API_URL repository variable. */\n" +
              "window.HOSPITOS_CONFIG = " + JSON.stringify({ apiUrl: url, onlineDemo: true }) + ";\n");'
          cat dist/hospit-hms/browser/config.js
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/hospit-hms/browser

  deploy-server:
    name: Deploy API to Render
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [server, web]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      API_URL: ${{ vars.HOSPITOS_API_URL }}
    steps:
      - name: Trigger the Render deploy
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL is not set, so the API was not redeployed. See docs/DEPLOY.md."
            exit 0
          fi
          curl -fsS -X POST "$HOOK" -o /dev/null
          echo "Render deploy started for ${GITHUB_SHA::7}."
      - name: Wait until Render runs this commit
        if: env.HOOK != '' && env.API_URL != ''
        run: |
          base="${API_URL%/}"
          for i in $(seq 1 120); do
            live=$(curl -fsS --max-time 60 "$base/actuator/info" 2>/dev/null | sed -n 's/.*"commit":"\([0-9a-f]*\)".*/\1/p' || true)
            if [ "$live" = "$GITHUB_SHA" ]; then echo "API is live on ${GITHUB_SHA::7}."; exit 0; fi
            echo "Waiting for Render (running: ${live:-not answering})..."
            sleep 10
          done
          echo "::error::Render did not start ${GITHUB_SHA::7} within 20 minutes. Check the deploy log on Render."
          exit 1

  deploy-web:
    name: Publish web app to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [deploy-server]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
